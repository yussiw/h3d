plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yussiw.h3d'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'com.yussiw.h3d'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
}
